[project]
name = "toweroffantasy.bot"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    { name = "Gabriel Nobrega", email = "gabrieltkdnobrega63@gmail.com" },
]
dependencies = [
    "discord-py>=2.4.0",
    "pydantic>=2.10.1",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    "unidecode>=1.3.8",
    "cachetools>=5.5.0",
]
requires-python = "==3.12.*"
readme = "README.md"
license = { text = "MIT" }


[tool.pdm]
distribution = false

[tool.pdm.scripts]
start = "python main.py"

[dependency-groups]
dev = ["types-cachetools>=5.5.0.20240820"]
